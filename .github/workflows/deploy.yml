name: Deploy Trigger

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: beercall
          POSTGRES_PASSWORD: beercall
          POSTGRES_DB: beercall_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BEERCALL_SECRET_KEY: "dummy_secret_for_ci"
      GEMINI_API_KEY: "dummy_gemini_key_for_ci"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run tests SQLite
        run: python -m pytest
        
      - name: Run tests PostgreSQL
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://beercall:beercall@localhost:55432/beercall_test"
        run: python -m pytest tests/postgres

  trigger:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger beercall-app deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_FOR_DEPLOYMENT }}
          repository: BeerCall/beercall-app
          event-type: trigger-deploy
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
