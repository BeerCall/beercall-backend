name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub plutôt qu'ECR Public : les runners GitHub partagent des IP
        # et ECR renvoie régulièrement `toomanyrequests: Data limit exceeded`.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: beercall
          POSTGRES_PASSWORD: beercall
          POSTGRES_DB: beercall_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      BEERCALL_SECRET_KEY: "dummy_secret_for_ci"
      GEMINI_API_KEY: "dummy_gemini_key_for_ci"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      # The app PR validates the integrated E2E suite and both 75% gates.
      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for root in ["api", "core", "db", "models", "schemas", "services", "workers", "alembic"]:
              for path in Path(root).rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          ast.parse(Path("main.py").read_text(encoding="utf-8"), filename="main.py")
          PY

      - name: Validate migrations on isolated PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg://beercall:beercall@localhost:55432/beercall_test"
        run: python -m alembic upgrade head

  dispatch-submodule:
    name: Dispatch submodule update
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify beercall-app
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SUBMODULE_DISPATCH_TOKEN }}
          repository: BeerCall/beercall-app
          event-type: submodule-updated
          client-payload: '{"repository":"beercall-backend","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}'
