version: '3.8'

services:
  test_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: beercall
      POSTGRES_PASSWORD: beercall
      POSTGRES_DB: beercall_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beercall -d beercall_test"]
      interval: 2s
      timeout: 5s
      retries: 10
